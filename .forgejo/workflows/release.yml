# **Forgejo-Fassung von .github/workflows/release.yml.**
#
# Erzeugt von Werkzeuge/forgejo/workflow-uebertragen.py am 27.10.2026.
# Gebaut wird fuer git.flexfamily.cloud; die GitHub-Fassung bleibt vorerst
# daneben bestehen.
#
# **Beide Dateien gehoeren synchron.** Wer an den Bauschritten etwas
# aendert, zieht es hier nach -- sonst laufen die Seiten auseinander, und
# das faellt erst auf, wenn eine von beiden rot wird.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer braucht die Historie inkl. Tags

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Version ermitteln
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "v=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: dotnet test LDAPeek.Tests/LDAPeek.Tests.csproj -c Release

      # Die Zugangsgruppe wird ins Binary kompiliert, damit sie zur Laufzeit
      # nicht änderbar ist. Sie steht in der Repo-Variable
      # LDAPEEK_REQUIRED_GROUP (Settings → Secrets and variables → Actions →
      # Variables) — damit taucht der Gruppenname nicht im Quellcode auf und
      # lässt sich ohne Commit ändern.
      #
      # Ist die Variable nicht gesetzt, entsteht ein Paket OHNE Einschränkung.
      # Das ist Absicht: ein Release soll nicht daran scheitern, aber es soll
      # auch niemand versehentlich eine falsche Gruppe einbacken.
      - name: Publish (win-x64)
        run: >
          dotnet publish LDAPeek/LDAPeek.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.v }}
          -p:RequiredGroup="${{ vars.LDAPEEK_REQUIRED_GROUP }}"
          -o publish/win-x64

      - name: Zugangsgruppe im Paket protokollieren
        run: |
          gruppe="${{ vars.LDAPEEK_REQUIRED_GROUP }}"
          if [ -z "$(echo "$gruppe" | tr -d "[:space:]")" ]; then
            echo "::warning::LDAPEEK_REQUIRED_GROUP ist nicht gesetzt — das Paket startet OHNE Gruppenbeschränkung."
          else
            echo "Paket ist auf die Gruppe ${gruppe} beschränkt."
          fi
      # Der Dateiname ist Teil der Schnittstelle: der Update-Checker liest die
      # Version daraus (siehe UpdateChannel.ParseVersionFromFileName). Wer ihn
      # ändert, macht das Ausrollen über den Netzwerkordner kaputt.
      - name: ZIP packen
        run: (cd publish/win-x64 && zip -qr "$OLDPWD/LDAPeek-${{ steps.ver.outputs.v }}-win-x64.zip" .)

      - uses: actions/upload-artifact@v3
        with:
          name: windows
          path: LDAPeek-*-win-x64.zip
          retention-days: 1

  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    # Beim manuellen Start (workflow_dispatch ohne Tag) überspringen.
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/download-artifact@v3
        with:
          path: dist

      - name: Release anlegen und Dateien anhaengen
        env:
          # Forgejo legt diesen Token je Lauf an; er gilt nur fuer dieses
          # Repo und nur solange der Lauf dauert.
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          # Besteht das Release schon (zweiter Lauf desselben Tags), werden
          # die Dateien ersetzt statt mit HTTP 409 abzubrechen.
          id=$(curl -sf -H "Authorization: token $TOKEN" \
                 "$SERVER/api/v1/repos/$REPO/releases/tags/$TAG" 2>/dev/null \
               | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' 2>/dev/null || true)
          if [ -z "$id" ]; then
            id=$(curl -sf -X POST -H "Authorization: token $TOKEN" \
                   -H "Content-Type: application/json" \
                   -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":\"Gebaut von Forgejo Actions.\"}" \
                   "$SERVER/api/v1/repos/$REPO/releases" \
                 | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          fi
          [ -n "$id" ] || { echo "Keine Release-ID erhalten"; exit 1; }

          hochgeladen=0
          # download-artifact@v3 legt je Artefakt ein Unterverzeichnis an,
          # deshalb rekursiv suchen statt im Arbeitsverzeichnis zu raten.
          for datei in $(find . -type f \( -name "LDAPeek-*-win-x64.zip" \) | sort); do
            [ -f "$datei" ] || continue
            # Gleichnamigen Anhang vorher loeschen, sonst haengt Forgejo die
            # Datei ein zweites Mal an statt sie zu ersetzen.
            alt=$(curl -sf -H "Authorization: token $TOKEN" \
                    "$SERVER/api/v1/repos/$REPO/releases/$id/assets" 2>/dev/null \
                  | python3 -c "import json,sys; print(next((str(a['id']) for a in json.load(sys.stdin) if a['name']=='$(basename "$datei")'), ''))" 2>/dev/null || true)
            [ -n "$alt" ] && curl -s -X DELETE -H "Authorization: token $TOKEN" \
              "$SERVER/api/v1/repos/$REPO/releases/$id/assets/$alt" >/dev/null
            echo "lade hoch: $datei ($(du -h "$datei" | cut -f1))"
            curl -sf -X POST -H "Authorization: token $TOKEN" \
              -F "attachment=@$datei" \
              "$SERVER/api/v1/repos/$REPO/releases/$id/assets?name=$(basename "$datei")" >/dev/null
            hochgeladen=$((hochgeladen+1))
          done
          # **Ein Release ohne Dateien ist kein Release.** Lieber hier rot
          # als eine leere Seite, die niemand bemerkt.
          [ "$hochgeladen" -gt 0 ] || { echo "Keine Datei hochgeladen"; exit 1; }
          echo "Fertig ($hochgeladen Dateien): $SERVER/$REPO/releases/tag/$TAG"